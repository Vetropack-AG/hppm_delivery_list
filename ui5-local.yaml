specVersion: "2.4"
metadata:
  name: zvgt.hppm.delivery.list
type: application
framework:
  name: SAPUI5
  version: 1.79.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: http://vpavd910.vetropack.corporate.ads:44300
            client: "200"
            destination: ERP_EMBEDDED_D91_200
          - path: /webapp/resources/zvgt/hppm
            destination: ERP_EMBEDDED_D91_200
            url: http://vpavd910.vetropack.corporate.ads:44300
            client: "200"
            pathPrefix: /sap/bc/ui5_ui5/sap/ZVGT_CONTROLS
          - path: /resources/zvgt/hppm
            destination: ERP_EMBEDDED_D91_200
            url: http://vpavd910.vetropack.corporate.ads:44300
            client: "200"
            pathPrefix: /sap/bc/ui5_ui5/sap/ZVGT_CONTROLS
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: zvgt.hppm.delivery.list
        ui5Theme: sap_fiori_3
