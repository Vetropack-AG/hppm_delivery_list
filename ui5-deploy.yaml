# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.4"
metadata:
  name: zvgt.hppm.delivery.list
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: ERP_EMBEDDED_D91_100
          url: http://vpavd910.vetropack.corporate.ads:44300
          client: "100"
          auth: basic
        credentials:
          username: env:UI5_USERNAME
          password: env:UI5_PASSWORD
        app:
          name: ZVGT_DEL_LIST
          description: "HPPM: Delivery List"
          package: ZVGT_HPPM_DELIVERY_LIST
          transport: "D91K917723"