# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.4"
metadata:
  name: zvgt.hppm.delivery_list
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: ERP_EMBEDDED_D91
          url: http://vpavd910.vetropack.corporate.ads:44300
        app:
          name: ZVGT_DEL_LIST
          description: "HPPM: Delivery List"
          package: ZVGT_HPPM_DEL_LIST
          transport: "123"
