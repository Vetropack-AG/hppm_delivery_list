specVersion: "2.4"
metadata:
  name: zvgt.hppm.delivery.list
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: http://vpavd910.vetropack.corporate.ads:44300
            client: "200"
            destination: ERP_EMBEDDED_D91
          - path: /webapp/resources/zvgt/hppm
            destination: ERP_EMBEDDED_D91
            url: http://vpavd910.vetropack.corporate.ads:44300
            client: "200"
            pathPrefix: /sap/bc/ui5_ui5/sap/ZVGT_CONTROLS
          - path: /resources/zvgt/hppm
            destination: ERP_EMBEDDED_D91
            url: http://vpavd910.vetropack.corporate.ads:44300
            client: "200"
            pathPrefix: /sap/bc/ui5_ui5/sap/ZVGT_CONTROLS
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.71.37
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: zvgt.hppm.delivery.list
        ui5Theme: sap_fiori_3
